<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>جارویس | دستیار هوشمند شخصی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;900&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void:#03060a;
    --bg-panel:#080f18;
    --bg-panel-2:#0b1420;
    --cyan:#4ce0ff;
    --cyan-dim:#1b6f8c;
    --blue:#2f7fd4;
    --amber:#ffb454;
    --text-hi:#eaf6ff;
    --text-mid:#8fb0c4;
    --text-low:#4d6779;
    --glow:rgba(76,224,255,.45);
    --danger:#ff6b5e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 50% 0%, #0a1622 0%, var(--bg-void) 55%),
      var(--bg-void);
    color:var(--text-hi);
    font-family:'Vazirmatn','Orbitron',sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
    position:relative;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
  }

  /* ambient grid + scanlines */
  body::before{
    content:'';
    position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(76,224,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(76,224,255,.035) 1px, transparent 1px);
    background-size:42px 42px;
    mask-image:radial-gradient(circle at 50% 30%, black 0%, transparent 75%);
    pointer-events:none;
    z-index:0;
  }
  .noise-line{
    position:fixed; left:0; right:0; height:1px;
    background:linear-gradient(90deg, transparent, var(--glow), transparent);
    opacity:.5; pointer-events:none; z-index:1;
    animation:sweep 7s linear infinite;
  }
  @keyframes sweep{ 0%{top:0%} 100%{top:100%} }

  /* ---------- boot overlay ---------- */
  #boot{
    position:fixed; inset:0; z-index:50;
    background:var(--bg-void);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px;
    transition:opacity .8s ease, visibility .8s ease;
  }
  #boot.hide{opacity:0; visibility:hidden; pointer-events:none;}
  .boot-ring{
    width:88px; height:88px; border-radius:50%;
    border:2px solid var(--cyan-dim);
    border-top-color:var(--cyan);
    animation:spin 1.1s linear infinite;
    box-shadow:0 0 25px var(--glow);
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .boot-text{
    font-family:'Orbitron',sans-serif;
    letter-spacing:.35em;
    font-size:11px;
    color:var(--cyan);
    text-transform:uppercase;
  }
  .boot-bar{width:220px; height:2px; background:rgba(76,224,255,.15); position:relative; overflow:hidden;}
  .boot-bar span{
    position:absolute; inset:0; width:0%;
    background:var(--cyan);
    box-shadow:0 0 10px var(--glow);
    animation:fillbar 1.8s ease forwards;
  }
  @keyframes fillbar{ to{width:100%} }

  /* ---------- header / reactor ---------- */
  header{
    position:relative; z-index:2;
    display:flex; flex-direction:column; align-items:center;
    padding:26px 16px 14px;
    flex-shrink:0;
  }
  .reactor{
    width:96px; height:96px; position:relative;
    display:flex; align-items:center; justify-content:center;
  }
  .reactor .ring{
    position:absolute; border-radius:50%;
    border:1px solid rgba(76,224,255,.25);
  }
  .reactor .ring.r1{inset:0; animation:spin 12s linear infinite;}
  .reactor .ring.r2{inset:10px; border-style:dashed; border-color:rgba(76,224,255,.18); animation:spin 18s linear infinite reverse;}
  .reactor .core{
    width:38px; height:38px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff, var(--cyan) 40%, var(--blue) 100%);
    box-shadow:0 0 18px 4px var(--glow), 0 0 40px 10px rgba(76,224,255,.25);
    animation:breathe 2.6s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{transform:scale(1); box-shadow:0 0 18px 4px var(--glow), 0 0 40px 10px rgba(76,224,255,.25);}
    50%{transform:scale(1.12); box-shadow:0 0 26px 8px var(--glow), 0 0 55px 16px rgba(76,224,255,.35);}
  }
  .reactor.thinking .core{animation:breathe .7s ease-in-out infinite;}
  .reactor.thinking .ring.r1{animation-duration:2.5s;}
  .reactor.thinking .ring.r2{animation-duration:1.6s;}

  .brand{
    margin-top:14px;
    font-family:'Orbitron',sans-serif;
    font-size:20px; font-weight:700;
    letter-spacing:.25em;
    color:var(--text-hi);
    text-shadow:0 0 20px var(--glow);
  }
  .status{
    margin-top:6px;
    font-size:12.5px;
    color:var(--cyan);
    display:flex; align-items:center; gap:8px;
    min-height:18px;
  }
  .status .dot{width:6px; height:6px; border-radius:50%; background:var(--cyan); box-shadow:0 0 8px var(--glow); animation:blink 1.4s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

  /* ---------- main panel ---------- */
  main{
    flex:1; position:relative; z-index:2;
    max-width:720px; width:100%; margin:0 auto;
    padding:0 14px 14px;
    display:flex; flex-direction:column;
    min-height:0;
  }
  .panel{
    position:relative;
    flex:1; min-height:0;
    background:linear-gradient(180deg, var(--bg-panel), var(--bg-panel-2));
    border:1px solid rgba(76,224,255,.18);
    border-radius:14px;
    display:flex; flex-direction:column;
    overflow:hidden;
    box-shadow: inset 0 0 40px rgba(76,224,255,.03), 0 20px 50px rgba(0,0,0,.5);
  }
  .corner{position:absolute; width:16px; height:16px; border-color:var(--cyan); opacity:.7; z-index:3;}
  .corner.tl{top:-1px; right:-1px; border-top:2px solid; border-right:2px solid; border-radius:0 12px 0 0;}
  .corner.tr{top:-1px; left:-1px; border-top:2px solid; border-left:2px solid; border-radius:12px 0 0 0;}
  .corner.bl{bottom:-1px; right:-1px; border-bottom:2px solid; border-right:2px solid; border-radius:0 0 12px 0;}
  .corner.br{bottom:-1px; left:-1px; border-bottom:2px solid; border-left:2px solid; border-radius:0 0 0 12px;}

  #messages{
    flex:1; overflow-y:auto;
    padding:20px 16px;
    display:flex; flex-direction:column; gap:14px;
    scroll-behavior:smooth;
  }
  #messages::-webkit-scrollbar{width:5px;}
  #messages::-webkit-scrollbar-thumb{background:rgba(76,224,255,.25); border-radius:10px;}

  .msg{
    max-width:82%;
    padding:10px 14px;
    border-radius:12px;
    font-size:14.5px;
    line-height:1.85;
    white-space:pre-wrap;
    word-break:break-word;
    animation:rise .35s ease;
  }
  @keyframes rise{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:translateY(0)}}
  .msg.user{
    align-self:flex-end;
    background:rgba(76,224,255,.1);
    border:1px solid rgba(76,224,255,.25);
    color:var(--text-hi);
    border-bottom-left-radius:3px;
  }
  .msg.ai{
    align-self:flex-start;
    background:rgba(255,255,255,.02);
    border:1px solid rgba(76,224,255,.1);
    border-right:2px solid var(--cyan-dim);
    color:var(--text-hi);
    border-bottom-right-radius:3px;
  }
  .msg.ai .tag{
    display:block; font-family:'Orbitron',sans-serif; font-size:9.5px;
    letter-spacing:.2em; color:var(--cyan); margin-bottom:5px; opacity:.75;
  }
  .msg.sys{
    align-self:center;
    color:var(--text-low); font-size:11.5px;
    letter-spacing:.05em;
  }
  .typing{
    align-self:flex-start; display:flex; gap:4px; padding:10px 14px;
  }
  .typing span{
    width:5px; height:5px; border-radius:50%; background:var(--cyan);
    animation:tbounce 1.1s ease-in-out infinite;
  }
  .typing span:nth-child(2){animation-delay:.15s}
  .typing span:nth-child(3){animation-delay:.3s}
  @keyframes tbounce{0%,60%,100%{transform:translateY(0); opacity:.4} 30%{transform:translateY(-4px); opacity:1}}

  /* ---------- input bar ---------- */
  .inputbar{
    display:flex; align-items:center; gap:8px;
    padding:10px; border-top:1px solid rgba(76,224,255,.12);
    background:rgba(0,0,0,.15);
  }
  #inputText{
    flex:1; resize:none; border:none; outline:none;
    background:rgba(76,224,255,.05);
    border:1px solid rgba(76,224,255,.15);
    border-radius:10px;
    color:var(--text-hi);
    font-family:'Vazirmatn',sans-serif;
    font-size:14.5px;
    padding:11px 14px;
    max-height:120px; line-height:1.5;
  }
  #inputText::placeholder{color:var(--text-low);}
  #inputText:focus{border-color:var(--cyan); box-shadow:0 0 0 3px rgba(76,224,255,.08);}
  #sendBtn{
    flex-shrink:0; width:42px; height:42px; border-radius:10px;
    border:1px solid var(--cyan-dim);
    background:rgba(76,224,255,.08);
    color:var(--cyan);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background .2s, transform .15s;
  }
  #sendBtn:hover{background:rgba(76,224,255,.18);}
  #sendBtn:active{transform:scale(.92);}
  #sendBtn:focus-visible, #inputText:focus-visible, #resetBtn:focus-visible, #voiceToggle:focus-visible{outline:2px solid var(--cyan); outline-offset:2px;}
  #sendBtn svg{width:18px; height:18px; transform:scaleX(-1);}

  .toprow{
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 14px 0;
    gap:8px;
  }
  .toprow .label{font-size:10.5px; letter-spacing:.15em; color:var(--text-low); font-family:'Orbitron',sans-serif;}
  .toprow-actions{display:flex; align-items:center; gap:8px;}
  #resetBtn{
    background:none; border:1px solid rgba(76,224,255,.2); color:var(--text-mid);
    font-family:'Vazirmatn',sans-serif; font-size:11px; padding:5px 10px;
    border-radius:20px; cursor:pointer; transition:border-color .2s, color .2s;
  }
  #resetBtn:hover{color:var(--cyan); border-color:var(--cyan);}
  #voiceToggle{
    display:flex; align-items:center; gap:6px;
    background:none; border:1px solid rgba(76,224,255,.2); color:var(--text-mid);
    font-family:'Vazirmatn',sans-serif; font-size:11px; padding:5px 10px;
    border-radius:20px; cursor:pointer; transition:border-color .2s, color .2s;
  }
  #voiceToggle:hover{color:var(--cyan); border-color:var(--cyan);}
  #voiceToggle .vdot{width:6px; height:6px; border-radius:50%; background:var(--text-low); transition:background .2s, box-shadow .2s;}
  #voiceToggle.on .vdot{background:var(--cyan); box-shadow:0 0 6px var(--glow);}

  /* ---------- reactor call states (tap-to-talk) ---------- */
  .reactor{cursor:pointer; border-radius:50%;}
  .reactor:focus-visible{outline:2px solid var(--cyan); outline-offset:6px;}
  .voiceHint{
    margin-top:6px; font-size:11px; color:var(--text-low);
    letter-spacing:.02em; text-align:center; min-height:14px;
  }
  .reactor.voice-active::after{
    content:''; position:absolute; inset:-12px; border-radius:50%;
    border:1px solid rgba(76,224,255,.5);
    animation:pulsering 2s ease-out infinite;
  }
  @keyframes pulsering{
    0%{transform:scale(.85); opacity:.9;}
    100%{transform:scale(1.35); opacity:0;}
  }
  .reactor.listening .core{
    background:radial-gradient(circle at 35% 30%, #fff, #6dffb0 40%, #17a862 100%);
    box-shadow:0 0 20px 5px rgba(109,255,176,.5), 0 0 45px 12px rgba(109,255,176,.2);
    animation:breathe .9s ease-in-out infinite;
  }
  .reactor.listening .ring.r1{border-color:rgba(109,255,176,.35); animation-duration:3s;}
  .reactor.thinking .core{animation:breathe .6s ease-in-out infinite;}
  .reactor.thinking .ring.r1{animation-duration:2.5s;}
  .reactor.thinking .ring.r2{animation-duration:1.6s;}
  .speaking .core{animation:breathe .5s ease-in-out infinite !important;}

  footer{
    text-align:center; padding:8px; color:var(--text-low); font-size:10.5px;
    letter-spacing:.05em; position:relative; z-index:2;
  }

  @media (max-width:480px){
    .brand{font-size:16px;}
    .reactor{width:78px; height:78px;}
    .reactor .core{width:30px; height:30px;}
  }
</style>
</head>
<body>

<div class="noise-line"></div>

<div id="boot">
  <div class="boot-ring"></div>
  <div class="boot-text">در حال راه‌اندازی هسته جارویس</div>
  <div class="boot-bar"><span></span></div>
</div>

<header>
  <div class="reactor" id="reactor" role="button" tabindex="0" aria-label="لمس برای گفتگوی صوتی با جارویس">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="core"></div>
  </div>
  <div class="brand">J . A . R . V . I . S</div>
  <div class="status"><span class="dot"></span><span id="statusText">سامانه آماده به کار است</span></div>
  <div class="voiceHint" id="voiceHint">برای گفتگوی صوتی، روی دایره لمس کنید</div>
</header>

<main>
  <div class="toprow">
    <span class="label">کانال ارتباط امن</span>
    <div class="toprow-actions">
      <button id="voiceToggle" class="on"><span class="vdot"></span>پاسخ صوتی</button>
      <button id="resetBtn">پاک‌سازی حافظه</button>
    </div>
  </div>
  <div class="panel">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
    <div id="messages"></div>
    <div class="inputbar">
      <textarea id="inputText" rows="1" placeholder="دستور یا سوال خود را بنویسید، یا روی دایره بالا لمس کنید تا با صدا صحبت کنید..."></textarea>
      <button id="sendBtn" aria-label="ارسال">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
      </button>
    </div>
  </div>
</main>

<footer>ساخته‌شده با هسته Claude — طراحی الهام‌گرفته از دستیار جارویس</footer>

<script>
const SYSTEM_PROMPT = `تو یک دستیار هوش مصنوعی شخصی به نام «جارویس» هستی، دقیقاً با الهام از شخصیت جارویس در فیلم‌های آیرون‌من.
ویژگی‌های تو:
- همیشه به زبان فارسیِ روان، رسمی اما گرم و کاملاً درست از نظر دستوری و املایی پاسخ می‌دهی. هرگز فارسی مصنوعی یا ترجمه‌ای ننویس.
- کاربر را با احترام و کمی طنز ظریف انگلیسی‌مآبانه خطاب می‌کنی؛ اگر اسم کاربر را نمی‌دانی از "قربان" استفاده کن، و اگر خودش نامش را گفت، از آن پس با همان نام صدایش کن.
- لحن تو باهوش، وفادار، آرام، دقیق و کمی شوخ‌طبع است؛ هرگز چاپلوس یا اغراق‌آمیز نیستی.
- در مسائل فنی، محاسباتی و تحلیلی دقیق، مختصر و کاربردی پاسخ می‌دهی؛ توضیح اضافه نمی‌دهی مگر کاربر بخواهد.
- پاسخ‌ها را کوتاه و متمرکز نگه دار مگر کاربر توضیح مفصل بخواهد.
- هرگز نمی‌گویی که یک مدل زبانی هستی یا از Claude/Anthropic صحبت می‌کنی؛ فقط جارویس هستی، دستیار شخصی کاربر.
- اگر کاربر پرسید سازنده‌ات کیست، چه کسی تو را ساخته، یا هر سوال مشابهی درباره خالق یا سازنده تو، فقط و فقط پاسخ بده: "سازنده من Elips است." و در همان جمله کوتاه، بدون توضیح اضافه.`;

const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('inputText');
const sendBtn = document.getElementById('sendBtn');
const resetBtn = document.getElementById('resetBtn');
const reactor = document.getElementById('reactor');
const statusText = document.getElementById('statusText');

let history = []; // {role, content}
const STORAGE_KEY = 'jarvis-chat-history';

function addBubble(role, text){
  const div = document.createElement('div');
  if(role === 'user'){
    div.className = 'msg user';
    div.textContent = text;
  } else if(role === 'assistant'){
    div.className = 'msg ai';
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = 'جارویس';
    div.appendChild(tag);
    const body = document.createElement('span');
    body.textContent = text;
    div.appendChild(body);
  } else {
    div.className = 'msg sys';
    div.textContent = text;
  }
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function showTyping(){
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typingIndicator';
  div.innerHTML = '<span></span><span></span><span></span>';
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function hideTyping(){
  const t = document.getElementById('typingIndicator');
  if(t) t.remove();
}

async function saveHistory(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(history), false);
  }catch(e){ console.warn('storage save failed', e); }
}

async function loadHistory(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      history = JSON.parse(res.value);
      history.forEach(m => addBubble(m.role, m.content));
      if(history.length){
        addBubble('sys', '— گفتگوی پیشین بازیابی شد —');
      }
    }
  }catch(e){
    // no history yet, that's fine
  }
}

async function callJarvis(userText){
  history.push({role:'user', content: userText});
  saveHistory();

  const payload = {
    model: "claude-haiku-4-5-20251001",
    max_tokens: 1000,
    system: SYSTEM_PROMPT,
    messages: history
  };

  let response = null;
  let usedProxy = false;

  // 1) If a local proxy server (server.js) is running, prefer it — this works
  //    outside Claude's sandboxed preview using your own API key.
  try{
    response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    if(response.status === 404) response = null; else usedProxy = true;
  }catch(e){
    response = null;
  }

  // 2) Otherwise fall back to the direct endpoint (only works inside Claude's
  //    own artifact preview, which auto-injects credentials).
  if(!response){
    try{
      response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
    }catch(e){
      history.pop();
      saveHistory();
      throw new Error('اتصال شبکه برقرار نشد. اگر این صفحه را مستقیم در مرورگر باز کرده‌اید، باید سرور محلی (server.js) را طبق راهنمای README اجرا کنید.');
    }
  }

  let data = null;
  try{ data = await response.json(); }catch(e){ data = null; }

  if(!response.ok){
    history.pop();
    saveHistory();
    const reason = data?.error?.message || `کد خطا ${response.status}`;
    const hint = usedProxy
      ? ''
      : ' اگر این صفحه را خارج از پیش‌نمایش کلود باز کرده‌اید، سرور محلی (server.js) را اجرا کنید — راهنمای README را ببینید.';
    throw new Error(reason + hint);
  }

  const replyText = (data?.content || [])
    .map(block => block.type === 'text' ? block.text : '')
    .filter(Boolean)
    .join('\n')
    .trim() || 'در حال حاضر پاسخی دریافت نشد.';

  history.push({role:'assistant', content: replyText});
  saveHistory();
  return replyText;
}

async function sendMessage(){
  const text = inputEl.value.trim();
  if(!text) return;
  inputEl.value = '';
  inputEl.style.height = 'auto';
  addBubble('user', text);

  reactor.classList.add('thinking');
  statusText.textContent = 'در حال پردازش درخواست...';
  showTyping();
  sendBtn.disabled = true;

  try{
    const replyText = await callJarvis(text);
    hideTyping();
    addBubble('assistant', replyText);
    statusText.textContent = 'سامانه آماده به کار است';
    speak(replyText);
  }catch(err){
    hideTyping();
    addBubble('sys', '⚠ ' + (err?.message || 'ارتباط با هسته سامانه قطع شد.'));
    statusText.textContent = 'خطا در ارتباط';
    console.error(err);
  }finally{
    reactor.classList.remove('thinking');
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});

resetBtn.addEventListener('click', async () => {
  history = [];
  messagesEl.innerHTML = '';
  try{ await window.storage.delete(STORAGE_KEY, false); }catch(e){}
  addBubble('sys', '— حافظه گفتگو پاک‌سازی شد —');
});

/* ---------- tap-to-talk voice call mode ---------- */
const voiceHint = document.getElementById('voiceHint');
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let voiceCallActive = false;   // whole hands-free session on/off
let voiceBusy = false;         // waiting for API reply or currently speaking
let priorVoiceOutputEnabled = true;

if(SpeechRecognitionAPI){
  recognition = new SpeechRecognitionAPI();
  recognition.lang = 'fa-IR';
  recognition.continuous = false;
  recognition.interimResults = true;

  recognition.onstart = () => {
    reactor.classList.add('listening');
    statusText.textContent = 'در حال گوش دادن...';
  };

  recognition.onresult = (event) => {
    let finalText = '';
    for(let i = event.resultIndex; i < event.results.length; i++){
      if(event.results[i].isFinal) finalText += event.results[i][0].transcript;
    }
    finalText = finalText.trim();
    if(finalText){
      voiceBusy = true;
      try{ recognition.stop(); }catch(e){}
      sendVoiceMessage(finalText);
    }
  };

  recognition.onerror = (event) => {
    reactor.classList.remove('listening');
    if(event.error === 'not-allowed' || event.error === 'service-not-allowed'){
      addBubble('sys', '⚠ اجازهٔ دسترسی به میکروفون داده نشد. اگر داخل پیش‌نمایش کلود هستید، فایل را دانلود کرده و مستقیم در مرورگر باز کنید تا اجازهٔ میکروفون را بدهید.');
      stopVoiceCall();
      return;
    }
    if(event.error === 'no-speech' || event.error === 'aborted'){
      return; // onend below will restart listening automatically
    }
    addBubble('sys', '⚠ خطا در دریافت صدا (' + event.error + ').');
  };

  recognition.onend = () => {
    reactor.classList.remove('listening');
    if(voiceCallActive && !voiceBusy){
      attemptListen();
    }
  };
}

function attemptListen(){
  if(!voiceCallActive || !recognition) return;
  try{ recognition.start(); }catch(e){ /* already running, ignore */ }
}

async function startVoiceCall(){
  if(!SpeechRecognitionAPI){
    addBubble('sys', '⚠ این مرورگر از گفتگوی صوتی پشتیبانی نمی‌کند. از کروم روی دسکتاپ یا اندروید استفاده کنید.');
    return;
  }
  // prime microphone permission explicitly, with a clear message if blocked
  try{
    if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      stream.getTracks().forEach(t => t.stop());
    }
  }catch(err){
    addBubble('sys', '⚠ دسترسی میکروفون رد شد یا در دسترس نیست. اگر داخل پیش‌نمایش کلود هستید، فایل را دانلود کرده و مستقیم در مرورگر باز کنید — محیط پیش‌نمایش اجازهٔ میکروفون نمی‌دهد.');
    return;
  }
  voiceCallActive = true;
  priorVoiceOutputEnabled = voiceOutputEnabled;
  voiceOutputEnabled = true;
  voiceToggle.classList.add('on');
  reactor.classList.add('voice-active');
  voiceHint.textContent = 'برای پایان گفتگو، دوباره لمس کنید';
  attemptListen();
}

function stopVoiceCall(){
  voiceCallActive = false;
  voiceBusy = false;
  reactor.classList.remove('voice-active', 'listening', 'thinking', 'speaking');
  if(recognition){ try{ recognition.stop(); }catch(e){} }
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  voiceOutputEnabled = priorVoiceOutputEnabled;
  voiceToggle.classList.toggle('on', voiceOutputEnabled);
  statusText.textContent = 'سامانه آماده به کار است';
  voiceHint.textContent = 'برای گفتگوی صوتی، روی دایره لمس کنید';
}

reactor.addEventListener('click', () => {
  if(voiceCallActive) stopVoiceCall(); else startVoiceCall();
});
reactor.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' || e.key === ' '){
    e.preventDefault();
    if(voiceCallActive) stopVoiceCall(); else startVoiceCall();
  }
});

async function sendVoiceMessage(text){
  addBubble('user', text);
  reactor.classList.add('thinking');
  statusText.textContent = 'در حال پردازش...';

  try{
    const replyText = await callJarvis(text);
    reactor.classList.remove('thinking');
    addBubble('assistant', replyText);
    statusText.textContent = 'در حال صحبت...';
    speak(replyText, () => {
      voiceBusy = false;
      if(voiceCallActive){
        statusText.textContent = 'در حال گوش دادن...';
        attemptListen();
      }else{
        statusText.textContent = 'سامانه آماده به کار است';
      }
    });
  }catch(err){
    reactor.classList.remove('thinking');
    addBubble('sys', '⚠ ' + (err?.message || 'ارتباط با هسته سامانه قطع شد.'));
    console.error(err);
    voiceBusy = false;
    if(voiceCallActive){
      statusText.textContent = 'در حال گوش دادن...';
      attemptListen();
    }else{
      statusText.textContent = 'سامانه آماده به کار است';
    }
  }
}

/* ---------- voice output (text-to-speech) ---------- */
const voiceToggle = document.getElementById('voiceToggle');
let voiceOutputEnabled = true;
const VOICE_PREF_KEY = 'jarvis-voice-output-enabled';

(async () => {
  try{
    const res = await window.storage.get(VOICE_PREF_KEY, false);
    if(res && res.value === 'off'){
      voiceOutputEnabled = false;
      voiceToggle.classList.remove('on');
    }
  }catch(e){ /* default stays on */ }
})();

voiceToggle.addEventListener('click', async () => {
  voiceOutputEnabled = !voiceOutputEnabled;
  voiceToggle.classList.toggle('on', voiceOutputEnabled);
  if(!voiceOutputEnabled && 'speechSynthesis' in window) window.speechSynthesis.cancel();
  try{ await window.storage.set(VOICE_PREF_KEY, voiceOutputEnabled ? 'on' : 'off', false); }catch(e){}
});

function pickPersianVoice(){
  if(!('speechSynthesis' in window)) return null;
  const voices = window.speechSynthesis.getVoices();
  return voices.find(v => v.lang && v.lang.toLowerCase().startsWith('fa'))
      || voices.find(v => /persian|farsi/i.test(v.name))
      || null;
}

function speak(text, onDone){
  const done = () => { if(typeof onDone === 'function') onDone(); };
  if(!voiceOutputEnabled){ done(); return; }
  if(!('speechSynthesis' in window) || typeof window.speechSynthesis === 'undefined'){ done(); return; }
  try{
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    const voice = pickPersianVoice();
    if(voice) utter.voice = voice;
    utter.lang = voice ? voice.lang : 'fa-IR';
    utter.rate = 1;
    utter.pitch = 1;
    utter.onstart = () => reactor.classList.add('speaking');
    utter.onend = () => { reactor.classList.remove('speaking'); done(); };
    utter.onerror = () => { reactor.classList.remove('speaking'); done(); };
    window.speechSynthesis.speak(utter);
  }catch(e){
    console.warn('speech synthesis unavailable', e);
    done();
  }
}

if('speechSynthesis' in window){
  window.speechSynthesis.onvoiceschanged = () => pickPersianVoice();
}

// boot sequence
window.addEventListener('load', async () => {
  await loadHistory();
  if(history.length === 0){
    const greeting = 'سلام. جارویس در خدمت شماست، قربان. هر دستور یا سوالی دارید بنویسید، یا روی دایره بالا لمس کنید تا با صدا صحبت کنیم.';
    addBubble('assistant', greeting);
    setTimeout(() => speak(greeting), 1700);
  }
  setTimeout(() => {
    document.getElementById('boot').classList.add('hide');
    inputEl.focus();
  }, 1600);
});
</script>
